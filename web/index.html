<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="KinoFlux 公开面（P0）——可先看流程与 Demo，再登录进入工作台。kino_mash_app 0.5.1">
  <meta name="application-version" content="kino_mash_app 0.5.1">
  <!-- Desktop-first：对齐现网 user-scalable=no -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="KinoFlux">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">

  <title>KinoFlux · kino_mash_app 0.5.1</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #f6f8fa; }
    #boot-skel {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 32px; text-align: center;
      font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1a1523;
    }
    #boot-skel .mark {
      width: 56px; height: 56px; border-radius: 14px;
      background: linear-gradient(135deg, #6b4eff, #36cfc9 60%, #ff7a59);
    }
    #boot-skel h1 { font-size: 18px; font-weight: 600; margin: 0; }
    #boot-skel p { max-width: 460px; margin: 0; color: #4a4458; font-size: 14px; line-height: 1.55; }
    #boot-skel .note {
      max-width: 480px; text-align: left; font-size: 13px; color: #4a4458;
      background: #efeaff; border: 1px solid #dcd2ff; border-radius: 12px; padding: 12px 14px;
    }
  </style>
</head>
<body>
  <div id="boot-skel" role="status" aria-live="polite">
    <div class="mark" aria-hidden="true"></div>
    <h1>正在加载 KinoFlux 工作台资源…</h1>
    <p>
      现网首屏约需拉取 <strong>main.dart.js ≈ 7MB</strong> + <strong>canvaskit.wasm ≈ 7MB</strong>（合计约 14MB+），
      不假设秒开。理解类内容加载后即可先看流程。
    </p>
    <div class="note">
      <strong>可先看流程再进工作台</strong><br>
      若网络较慢，进入页面后选择「先看流程」。写入类操作（上传、开剪、库管理）仍需登录。
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-skel');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
